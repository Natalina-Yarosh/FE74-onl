<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <title>Axit</title>
</head>

<body>
    <header class="axit-header">
        <div class="axit-header__container">
            <div class="container-nav">
                <a href="index.html" class="axit-header__logo"><img class="axit-header__logo-img" src="svg/logo.svg" alt="AXIT-logo"></a>
            <nav class="axit-header__navigation">
                <ul class="axit-header__nav-lists">
                    <li class="axit-header__nav-list"><a href="#" class="axit-header__nav-link">Features</a></li>
                    <li class="axit-header__nav-list"><a href="#" class="axit-header__nav-link">About</a></li>
                    <li class="axit-header__nav-list"><a href="#" class="axit-header__nav-link">Pricing</a></li>
                    <li class="axit-header__nav-list"><a href="#" class="axit-header__nav-link">Reviews</a></li>
                    <li class="axit-header__nav-list"><a href="#" class="axit-header__nav-link">Contact</a></li>
                </ul>
            </nav>
            </div>
        </div>
    </header>

    <main>
        <section class="axit-main">
            <div class="axit-main__container">
                <div class="axit-main__wrapper">
                    <div class="axit-main__wrapper-text">
                        <div class="axit-main__wrapper-logo"><img class="axit-main__text-logo" src="/svg/logo.svg" alt="AXIT-main"></div>
                        <h1 class="axit-main__title">MODERN AXURE TEMPLATE FOR BEAUTIFUL PROTOTYPES</h1>
                        <div class="axit-main__line"></div>
                        <p class="axit-main__text">Lorem ipsum dolor sit amet, consectetur adipiscing elit</p>
                        <button class="axit-main__download-btn">Download</button>
                    </div>
                    <div class="axit-main__wrapper-form">
                        <p class="axit-main__form-text">Try Your <span class="axit-main__form-span">FREE</span> Trial Today</p>
                        <form class="axit__main-form">
                            <div class="axit-main__form-data">
                                <div class="axit-main__form-group">
                                    <input class="axit-main__input" type="text" id="name" name="name" placeholder="Name">
                                </div>
                                <div class="axit-main__form-group"> 
                                    <input class="axit-main__input" type="text" id="email" name="email" placeholder="Email">
                                </div>
                                <div class="axit-main__form-group">
                                    <input class="axit-main__input" type="text" id="password" name="password" placeholder="Password">
                                </div>
                            </div>
                        </form>
                        <button class="axit-main__form-btn">Get Started</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="axit-footer">
        <div class="axit-footer__container">
            <div class="axit-footer__info-wrapper">
                <h3 class="axit-footer__title">Social Media</h3>
                <p class="axit-footer__info">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean euismod bibendum laoreet</p>
            </div>
        
        <div class="axit-footer__links-wrapper">
             <ul class="axit-footer__links">
                    <li class="axit-footer__list">
                        <a href="#" class="axit-footer__link">
                            <img src="./svg/facebook_icon.svg" alt="facebook">
                        </a>
                    </li>
                    <li class="axit-footer__list">
                        <a href="#" class="axit-footer__link">
                            <img src="./svg/twitter_icon.svg" alt="Twitter">
                        </a>
                    </li>
                    <li class="axit-footer__list">
                        <a href="#" class="axit-footer__link">
                            <img src="./svg/linkedin_icon.svg" alt="Linkedln">
                        </a>
                    </li>
                    <li class="axit-footer__list">
                        <a href="#" class="axit-footer__link">
                            <img src="./svg/pinterest_icon.svg" alt="Pinterest">
                        </a>
                    </li>
                    <li class="axit-footer__list">
                        <a href="#" class="axit-footer__link">
                            <img src="./svg/instagram_icon.svg" alt="Instagram">
                        </a>
                    </li>
                    <li class="axit-footer__list">
                        <a href="#" class="axit-footer__link">
                            <img src="./svg/github_icon.svg" alt="GitHub">
                        </a>
                    </li>
                    <li class="axit-footer__list">
                        <a href="#" class="axit-footer__link">
                            <img src="/svg/rss_icon.svg" alt="rss">
                        </a>
                    </li>
                </ul>
        </div>
        </div>
    </footer>
</body>

</html>
